<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Packer — Jurisbooks</title>
<meta name="description" content="Orders to pack, for staff of businesses on Jurisbooks.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12283f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Packer">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="images/packer-192.png">
<link rel="manifest" href="packer.webmanifest">
<link rel="stylesheet" href="css/packer.css">
</head>
<body>
<header class="pk-top">
  <div><b>Packer</b> <span id="pkWho"></span></div>
  <button id="pkRefresh" type="button" hidden>Refresh</button>
</header>

<div id="pkInstall" class="pk-install" hidden></div>

<main id="pkSignIn" class="pk-card pk-gate" hidden>
  <h1>Orders to pack</h1>
  <div id="pkStepPhone">
    <p>Sign in with the mobile number your owner has on the staff list. You need to do this only once on this phone.</p>
    <label for="pkPhone">Mobile number</label>
    <div class="pk-phone"><span>+91</span><input id="pkPhone" type="tel" inputmode="numeric" maxlength="14" autocomplete="tel" placeholder="98765 43210"></div>
    <button id="pkSend" type="button" class="pk-main">Send code</button>
  </div>
  <div id="pkStepCode" hidden>
    <p>Code sent to <b id="pkCodeFor"></b></p>
    <label for="pkCode">6-digit code</label>
    <input id="pkCode" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <button id="pkVerify" type="button" class="pk-main">Sign in</button>
    <button id="pkBack" type="button" class="pk-link">Change number</button>
  </div>
  <p id="pkMsg" class="pk-msg"></p>
</main>

<main id="pkView" hidden>
  <p id="pkViewMsg" class="pk-msg"></p>
  <div id="pkJobs"></div>
  <button id="pkOut" type="button" class="pk-link">Sign out of this phone</button>
</main>

<script src="js/packer.js"></script>
</body>
</html>
